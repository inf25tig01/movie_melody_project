<!-- MOVIE POPUP -->

<div id="movieModal" class="modal">

    <div class="modal-content">

        <h2 id="modalTitle"></h2>

        <ul id="modalSongs"></ul>

        <div class="modal-buttons">


            <button onclick="closeModal()">
                Check Out Other Movies
            </button>

        </div>

    </div>

</div>

<script>

function openModal(movie, songs)
{
    document.getElementById("modalTitle").innerText = movie;

    const list =
        document.getElementById("modalSongs");

    list.innerHTML = "";

    songs.forEach(song =>
    {
        const li =
            document.createElement("li");

        li.innerText = song;

        list.appendChild(li);
    });

    document
        .getElementById("movieModal")
        .style.display = "flex";
}

function closeModal()
{
    document
        .getElementById("movieModal")
        .style.display = "none";
}

window.onclick = function(event)
{
    const modal =
        document.getElementById("movieModal");

    if(event.target === modal)
    {
        closeModal();
    }
}

</script>
